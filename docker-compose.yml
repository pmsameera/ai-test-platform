services:

  backend:
    build:
      context: ./backend

    container_name: ai-test-platform-api

    ports:
      - "8000:8000"

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_test_platform
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    depends_on:
      - db


  db:
    image: postgres:17

    container_name: ai-test-platform-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_test_platform

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data


volumes:
  postgres_data: